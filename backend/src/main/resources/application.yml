server:
  port: 8080

spring:
  application:
    name: odauday-stay-backend
  datasource:
    url: jdbc:h2:file:./data/odauday;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console

app:
  jwt:
    secret: odaudaystaysecretkeyforjwttokengenerationshouldbelongenough256bit
    expiration-ms: 86400000
